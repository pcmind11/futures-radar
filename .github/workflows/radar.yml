name: radar

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (check = 점검만, weekly = 주간 리포트까지)"
        type: choice
        default: normal
        options:
          - normal
          - weekly
          - check

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 에이전트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODE: ${{ inputs.mode }}
        run: python3 agent.py

      - name: 결과 저장
        if: ${{ inputs.mode != 'check' }}
        run: |
          git config user.name "futures-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: $(date -u +%F)"
          git push

      - name: 페이지 설정
        if: ${{ inputs.mode != 'check' }}
        uses: actions/configure-pages@v5

      - name: 사이트 빌드
        if: ${{ inputs.mode != 'check' }}
        uses: actions/jekyll-build-pages@v1

      - name: 사이트 업로드
        if: ${{ inputs.mode != 'check' }}
        uses: actions/upload-pages-artifact@v4

  deploy:
    if: ${{ inputs.mode != 'check' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 사이트 배포
        id: deployment
        uses: actions/deploy-pages@v4yaml
